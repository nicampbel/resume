<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicholas Campbell | MEng (Cum Laude) | Data Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2e4a;
      --navy-light: #243d60;
      --accent: #c8a96e;
      --bg: #eceae6;
      --page-shadow: 0 4px 32px rgba(26,46,74,0.13), 0 1px 4px rgba(26,46,74,0.07);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      font-family: 'Source Sans 3', sans-serif;
      min-height: 100vh;
      padding-top: 64px;
    }

    /* ── Top bar ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(26,46,74,0.25);
    }

    .header-name {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 300;
      font-size: 1.05rem;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .header-name strong {
      font-weight: 700;
    }

    .header-name .sep {
      color: var(--accent);
      margin: 0 8px;
      font-weight: 300;
    }

    .download-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: var(--navy);
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 500;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 9px 20px;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    .download-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }

    .download-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ── PDF viewer ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px 64px;
      opacity: 0;
      animation: fadeUp 0.4s ease 0.05s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .pdf-wrap {
      box-shadow: var(--page-shadow);
      border-radius: 1px;
      overflow: hidden;
      background: #fff;
    }

    .pdf-wrap embed {
      display: block;
      width: 100%;
      height: calc(100vh - 64px - 80px);
      min-height: 600px;
      border: none;
    }

    /* Mobile fallback — embed unreliable on iOS */
    .mobile-fallback {
      display: none;
      padding: 48px 24px;
      text-align: center;
      color: var(--navy);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .mobile-fallback a {
      color: var(--navy);
      font-weight: 500;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px 0 40px;
      font-size: 0.75rem;
      color: rgba(26,46,74,0.35);
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .header-name { font-size: 1.1rem; }
      main { padding: 20px 12px 48px; }
      .pdf-wrap embed { display: none; }
      .mobile-fallback { display: block; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-name">
      <strong>Nicholas Campbell</strong>
      <span class="sep">|</span>MEng (Cum Laude)
      <span class="sep">|</span>Data Engineer
    </div>
    <a class="download-btn" href="Nicholas_Campbell_CV.pdf" download>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v8M5 7l3 3 3-3"/><path d="M3 12h10"/>
      </svg>
      Download PDF
    </a>
  </header>

  <main>
    <div class="pdf-wrap">
      <embed src="Nicholas_Campbell_CV.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf">
      <div class="mobile-fallback">
        PDF preview isn't supported on this browser.<br>
        <a href="Nicholas_Campbell_CV.pdf">Tap here to open the CV</a> or use the Download button above.
      </div>
    </div>
  </main>

  <footer>nicampbel.github.io/resume</footer>

</body>
</html>
