<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicholas Campbell — CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2e4a;
      --navy-light: #243d60;
      --accent: #c8a96e;
      --bg: #eceae6;
      --page-shadow: 0 4px 32px rgba(26,46,74,0.13), 0 1px 4px rgba(26,46,74,0.07);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding-top: 64px;
    }

    /* ── Top bar ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(26,46,74,0.25);
    }

    .header-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 1.35rem;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .header-name span {
      color: var(--accent);
    }

    .download-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 9px 20px;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    .download-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }

    .download-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ── Pages container ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 72px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    .page-wrap {
      width: 100%;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    .page-wrap:nth-child(1) { animation-delay: 0.05s; }
    .page-wrap:nth-child(2) { animation-delay: 0.15s; }
    .page-wrap:nth-child(3) { animation-delay: 0.25s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .page-wrap img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: var(--page-shadow);
      border-radius: 1px;
    }

    /* ── Loading state ── */
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 80px 0;
      color: var(--navy);
      opacity: 0.5;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(26,46,74,0.15);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 0 0 40px;
      font-size: 0.75rem;
      color: rgba(26,46,74,0.35);
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .header-name { font-size: 1.1rem; }
      main { padding: 32px 12px 56px; gap: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-name">Nicholas <span>Campbell</span></div>
    <a class="download-btn" href="Nicholas_Campbell_CV.pdf" download>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v8M5 7l3 3 3-3"/><path d="M3 12h10"/>
      </svg>
      Download PDF
    </a>
  </header>

  <main id="pages">
    <div id="loader">
      <div class="spinner"></div>
      Loading CV…
    </div>
  </main>

  <footer>nicampbel.github.io/resume</footer>

  <script>
    (function () {
      const container = document.getElementById('pages');
      const loader = document.getElementById('loader');
      let index = 1;

      function loadNext() {
        const img = new Image();
        img.src = 'Nicholas_Campbell_CV_' + index + '.png';
        img.alt = 'CV page ' + index;
        img.onload = function () {
          if (index === 1) loader.remove();
          const wrap = document.createElement('div');
          wrap.className = 'page-wrap';
          wrap.appendChild(img);
          container.appendChild(wrap);
          index++;
          loadNext();
        };
        img.onerror = function () {
          if (index === 1) {
            loader.innerHTML = 'Could not load CV pages.';
          }
        };
      }

      loadNext();
    })();
  </script>

</body>
</html>
